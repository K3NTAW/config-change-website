name: CI

on:
  push:
    branches: [main, master, nrt-ipa]
  pull_request:
    branches: [main, master, nrt-ipa]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # prisma.ts throws if DATABASE_URL is unset at import; jwt.ts requires JWT_SECRET (min. 16 chars).
    # Unit tests mock DB calls — no PostgreSQL service needed unless you run DB integration tests.
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
      JWT_SECRET: ci-jwt-secret-not-for-production-use
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test
